services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_URL=host=postgres user=postgres password=secret dbname=authdb port=5432 sslmode=disable
      - JWT_SECRET=supersecretkey
      - ENV=dev
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: authdb  # ✅ DB is auto-created at startup
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
